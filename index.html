<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Lab · 相机拼图</title>
<link rel="stylesheet" href="style.css">
<script src="assets/images.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<header><a class="brand" href="./index.html"><span class="brand-icon">▣</span> FRAME LAB <small>相机拼图工作室</small></a><span class="privacy"><i></i> 照片仅在本机处理</span></header>
<main>
<section class="editor">
<div class="eyebrow">A LITTLE FRAME, A LITTLE STORY</div>
<h1>把日常，<br>装进相机里。</h1>
<p class="intro">一张照片，两种视角。保留相机的质感，<br>让屏幕里的画面，与你的照片相呼应。</p>
<div class="panel">
<div class="section-title"><span>01</span><h2>选择你的照片</h2><button id="sample" class="text-button">试用示例</button></div>
<label class="upload" id="dropzone"><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/gif"><span class="upload-icon">＋</span><strong>点击上传，或拖入照片</strong><span>支持 JPG、PNG、WebP 等浏览器可读格式</span></label>
<p id="filename" class="filename">南瓜与午后阳光 · 示例照片</p>
<div class="section-title"><span>02</span><h2>调整照片构图</h2><button id="reset" class="text-button">重置</button></div>
<p class="hint">拖动下方照片调整构图，屏幕同步更新，上方背景自动虚化。</p>
<label class="slider-label" for="zoom">照片缩放 <output id="zoom-value">100%</output></label><input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
<div class="positions"><label>水平位置<input id="horizontal" type="range" min="0" max="100" value="50"></label><label>垂直位置<input id="vertical" type="range" min="0" max="100" value="50"></label></div>
<div class="section-title export-title"><span>03</span><h2>保存你的作品</h2></div>
<div class="export-options"><label>导出尺寸<select id="size"><option value="1080">1080 × 1440 · 标准</option><option value="2160">2160 × 2880 · 大图</option></select></label><label>格式<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option></select></label></div>
<button id="download" class="download">下载拼图 <span>↗</span></button>
<p class="footnote">大图导出不会增加原模板细节。建议使用清晰原图。</p>
</div>
</section>
<section class="preview-section"><div class="preview-heading"><span><i></i> 实时预览</span><span>固定相机模板 / 3:4</span></div><div class="canvas-wrap"><canvas id="preview" width="1080" height="1440" aria-label="相机拼图预览，上方相机屏幕和下方照片同步显示"></canvas></div><p class="preview-caption">YOUR MOMENT, IN FRAME.</p></section>
</main><div id="status" role="status" aria-live="polite"></div>
<footer>FRAME LAB <span>让每一张照片，都有自己的故事。</span></footer>
</body></html>
